[package]
name = "rdpea-tauri"
version = "1.2.0-alpha.0"
description = "Lightweight RDP Remote Desktop Client"
authors = ["bluewhackadoo"]
edition = "2021"

[lib]
name = "rdpea_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
arboard = "3"
dirs = "5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
hex = "0.4"
rand = "0.8"

aes-gcm = "0.10"
sha2 = "0.10"

# IronRDP — battle-tested Rust RDP implementation
ironrdp = { version = "0.14", features = ["connector", "session", "graphics"] }
ironrdp-tokio = { version = "0.8", features = ["reqwest"] }
ironrdp-graphics = "0.7"
sspi = { version = "0.18", features = ["network_client", "tsssp"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
x509-cert = "0.2"
