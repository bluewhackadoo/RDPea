name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Release flow
#   1. create-release  → exactly one draft release for the tag (single creator ⇒ no duplicate drafts)
#   2. build-*         → build, sign, upload assets to that draft
#   3. publish-release → flip the draft to a published "latest" release only once the signed
#                        Windows build (the auto-updater's primary target) has uploaded, so
#                        clients never see a half-populated release
#   4. package managers publish from the finished release

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — reusing it"
          else
            gh release create "$tag" --title "RDPea $tag" --generate-notes --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run generate-icons

      - name: Build (no publish)
        run: bunx --bun vite build && bunx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Update latest.yml with post-signing hashes
        run: |
          # After signing, the exe hash changed. Recalculate and update latest.yml
          Get-ChildItem release/*.yml | ForEach-Object {
            $ymlFile = $_.FullName
            $content = Get-Content $ymlFile -Raw
            Write-Host "Processing: $($_.Name)"

            # Find each file/sha512 pair and recalculate
            $lines = Get-Content $ymlFile
            $updatedLines = @()
            $nextLineIsHash = $false
            $currentFile = $null

            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]

              # Match "  - url: SomeFile.exe" or "path: SomeFile.exe"
              if ($line -match '^\s+- url:\s+(.+\.exe)\s*$') {
                $currentFile = $Matches[1]
              }
              elseif ($line -match '^\s+path:\s+(.+\.exe)\s*$') {
                $currentFile = $Matches[1]
              }

              # Match "    sha512: <hash>" and replace if we have a current exe file
              if ($line -match '^\s+sha512:\s+' -and $currentFile) {
                $exePath = Join-Path "release" $currentFile
                if (Test-Path $exePath) {
                  $bytes = [System.IO.File]::ReadAllBytes($exePath)
                  $sha512 = [System.Security.Cryptography.SHA512]::Create()
                  $hash = $sha512.ComputeHash($bytes)
                  $b64 = [Convert]::ToBase64String($hash)
                  $indent = $line -replace '(^\s+sha512:).*', '$1'
                  $line = "$indent $b64"
                  Write-Host "  Updated hash for $currentFile"
                }
                $currentFile = $null
              }

              # Match "    size: <number>" and update if we have a current exe file
              if ($line -match '^\s+size:\s+\d+' -and $currentFile) {
                $exePath = Join-Path "release" $currentFile
                if (Test-Path $exePath) {
                  $size = (Get-Item $exePath).Length
                  $indent = $line -replace '(^\s+size:).*', '$1'
                  $line = "$indent $size"
                  Write-Host "  Updated size for $currentFile"
                }
              }

              $updatedLines += $line
            }

            $updatedLines -join "`n" | Set-Content $ymlFile -NoNewline
            Write-Host "--- Updated $($_.Name) ---"
            Get-Content $ymlFile
          }

      - name: Verify latest.yml matches signed installer
        run: |
          $yml = Get-Content release/latest.yml -Raw
          if ($yml -notmatch '(?m)^path:\s+(.+\.exe)\s*$') { Write-Error "latest.yml has no path entry"; exit 1 }
          $exe = Join-Path release $Matches[1]
          if (-not (Test-Path $exe)) { Write-Error "latest.yml points at missing file $exe"; exit 1 }
          $expected = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash([System.IO.File]::ReadAllBytes($exe)))
          if ($yml -notmatch "(?m)^sha512:\s+$([regex]::Escape($expected))\s*$") { Write-Error "latest.yml sha512 does not match $exe"; exit 1 }
          Write-Host "latest.yml OK: $exe sha512 verified"

      # Only the installer + update manifest are uploaded. The .blockmap is deliberately left
      # out: it was generated before signing and no longer matches the exe, so the updater
      # must fall back to a full download instead of a corrupt differential one.
      - name: Upload signed artifacts to draft release
        run: |
          $tag = "${{ github.ref_name }}"
          Get-ChildItem release/*.exe, release/*.yml | ForEach-Object {
            Write-Host "Uploading: $($_.Name)"
            gh release upload $tag $_.FullName --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.yml

  build-macos:
    needs: create-release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run generate-icons

      # --publish never: letting electron-builder publish here created a *second*, draft
      # release for the same tag, so latest-mac.yml never reached the real release.
      - name: Build (no publish)
        run: bunx --bun vite build && bunx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to draft release
        run: |
          tag="${{ github.ref_name }}"
          for f in release/*.dmg release/*.zip release/*.blockmap release/*.yml; do
            [ -f "$f" ] && echo "Uploading: $(basename "$f")" && gh release upload "$tag" "$f" --clobber
          done
          true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Generate icons
        run: bun run generate-icons

      - name: Build (no publish)
        run: bunx --bun vite build && bunx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to draft release
        run: |
          tag="${{ github.ref_name }}"
          for f in release/*.AppImage release/*.deb release/*.snap release/*.yml; do
            [ -f "$f" ] && echo "Uploading: $(basename "$f")" && gh release upload "$tag" "$f" --clobber
          done
          true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            release/*.AppImage
            release/*.deb
            release/*.snap
            release/*.yml

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    # Publish as long as the signed Windows build (the updater's primary target) succeeded;
    # a failed mac/linux job can be re-run and its assets re-uploaded with --clobber.
    if: ${{ !cancelled() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify update manifest is attached
        run: |
          tag="${{ github.ref_name }}"
          assets=$(gh release view "$tag" --json assets -q '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -qx 'latest.yml' || { echo "::error::latest.yml missing from $tag — Windows auto-update would fail"; exit 1; }
          echo "$assets" | grep -q 'Setup-.*\.exe$' || { echo "::error::Setup exe missing from $tag"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  publish-winget:
    needs: publish-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit to Winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: bluewhackadoo.RDPea
          installers-regex: 'RDPea-Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  publish-chocolatey:
    needs: [build-windows, publish-release]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release

      - name: Build and push Chocolatey package
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $tag = "${{ github.ref_name }}"

          # Get SHA256 of the signed setup exe
          $setupExe = Get-ChildItem release/*Setup*.exe | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "Setup exe not found in release artifacts"
            exit 1
          }
          $sha256 = (Get-FileHash $setupExe.FullName -Algorithm SHA256).Hash
          $url = "https://github.com/bluewhackadoo/RDPea/releases/download/$tag/$($setupExe.Name)"

          Write-Host "Version: $version"
          Write-Host "URL: $url"
          Write-Host "SHA256: $sha256"

          # Update nuspec version and release notes URL
          $nuspec = Get-Content packaging/chocolatey/rdpea.nuspec -Raw
          $nuspec = $nuspec -replace '<version>[^<]*</version>', "<version>$version</version>"
          $nuspec = $nuspec -replace 'releases/tag/v[^"<]*', "releases/tag/$tag"
          Set-Content packaging/chocolatey/rdpea.nuspec $nuspec -NoNewline

          # Update install script URL and checksum
          $install = Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1 -Raw
          $install = $install -replace "\`$url64\s*=\s*'[^']*'", "`$url64      = '$url'"
          $install = $install -replace "checksum64\s*=\s*'[^']*'", "checksum64    = '$sha256'"
          Set-Content packaging/chocolatey/tools/chocolateyinstall.ps1 $install -NoNewline

          Write-Host "--- Updated nuspec ---"
          Get-Content packaging/chocolatey/rdpea.nuspec
          Write-Host "--- Updated install script ---"
          Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1

          # Pack and push
          choco pack packaging/chocolatey/rdpea.nuspec --output-directory .
          Get-ChildItem *.nupkg
          choco push "rdpea.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  publish-snap:
    needs: [build-linux, publish-release]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: artifacts

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Publish to Snap Store
        run: |
          SNAP=$(find artifacts -name '*.snap' -type f | head -1)
          if [ -z "$SNAP" ]; then
            echo "No snap found in artifacts"
            exit 1
          fi
          echo "Publishing: $(basename $SNAP)"
          snapcraft upload "$SNAP" --release=stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
